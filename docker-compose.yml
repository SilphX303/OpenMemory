services:
  openmemory:
    build:
      context: ./packages/openmemory-js
      dockerfile: Dockerfile
    ports:
      - '8180:8080'
    environment:
      # Core Configuration
      - OM_PORT=8080
      - OM_MODE=langgraph
      - OM_TIER=deep
      - OM_DB_PATH=/data/openmemory.sqlite
      - OM_API_KEY=
      - OM_IDE_MODE=false
      - OM_IDE_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://10.0.26.11:3000,http://memory-ui.arkadia.network

      # Rate Limiting
      - OM_RATE_LIMIT_ENABLED=false
      - OM_RATE_LIMIT_WINDOW_MS=60000
      - OM_RATE_LIMIT_MAX_REQUESTS=100

      # Compression
      - OM_COMPRESSION_ENABLED=false
      - OM_COMPRESSION_ALGORITHM=auto
      - OM_COMPRESSION_MIN_LENGTH=100

      # Embeddings Configuration
      - OM_EMBEDDINGS=ollama
      - OM_EMBEDDING_FALLBACK=synthetic
      - OM_EMBED_MODE=simple
      - OM_ADV_EMBED_PARALLEL=false
      - OM_EMBED_DELAY_MS=200
      - OM_VEC_DIM=1024

      # OpenAI Provider
      - OPENAI_API_KEY=
      - OM_OPENAI_API_KEY=
      - OM_OPENAI_BASE_URL=https://api.openai.com/v1
      - OM_OPENAI_MODEL=

      # Gemini Provider
      - GEMINI_API_KEY=
      - OM_GEMINI_API_KEY=

      # AWS Provider
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_REGION=

      # Ollama Provider
      - OLLAMA_URL=http://10.0.26.11:11434
      - OM_OLLAMA_URL=http://10.0.26.11:11434

      # Local Model
      - LOCAL_MODEL_PATH=
      - OM_LOCAL_MODEL_PATH=

      # Memory & Search
      - OM_MIN_SCORE=0.3
      - OM_MAX_PAYLOAD_SIZE=1000000

      # LangGraph Configuration
      - OM_LG_NAMESPACE=default
      - OM_LG_MAX_CONTEXT=50
      - OM_LG_REFLECTIVE=true

      # Metadata Backend (PostgreSQL with pgvector)
      - OM_METADATA_BACKEND=postgres
      - OM_PG_HOST=10.0.26.11
      - OM_PG_PORT=5432
      - OM_PG_DB=openmemory
      - OM_PG_USER=postgres
      - OM_PG_PASSWORD=Gojfg74j2LbthN7bllrrUnEs4YXfRYHL8VEx85Eql8jdLhyJT5DR1VK5Ou7geIi4
      - OM_PG_SCHEMA=public
      - OM_PG_TABLE=openmemory_memories
      - OM_PG_SSL=disable

      # Vector Backend
      - OM_VECTOR_BACKEND=pgvector
      - OM_VECTOR_TABLE=openmemory_vectors
      - OM_WEAVIATE_URL=
      - OM_WEAVIATE_API_KEY=
      - OM_WEAVIATE_CLASS=OpenMemory

      # Auto Reflection
      - OM_AUTO_REFLECT=false
      - OM_REFLECT_INTERVAL=10
      - OM_REFLECT_MIN_MEMORIES=20

      # User Summaries
      - OM_USER_SUMMARY_INTERVAL=30
      - OM_USE_SUMMARY_ONLY=true
      - OM_SUMMARY_MAX_LENGTH=200

      # HSG Configuration
      - OM_SEG_SIZE=10000
      - OM_CACHE_SEGMENTS=3
      - OM_MAX_ACTIVE=64

      # Decay System
      - OM_DECAY_LAMBDA=0.02
      - OM_DECAY_INTERVAL_MINUTES=1440
      - OM_DECAY_RATIO=0.03
      - OM_DECAY_SLEEP_MS=200
      - OM_DECAY_THREADS=3
      - OM_DECAY_COLD_THRESHOLD=0.25
      - OM_DECAY_REINFORCE_ON_QUERY=true

      # Compression & Regeneration
      - OM_REGENERATION_ENABLED=true
      - OM_MAX_VECTOR_DIM=1024
      - OM_MIN_VECTOR_DIM=64
      - OM_SUMMARY_LAYERS=3

      # Keyword Extraction
      - OM_KEYWORD_BOOST=2.5
      - OM_KEYWORD_MIN_LENGTH=3
    volumes:
      - openmemory_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'require("http").get("http://localhost:8080/health",(res)=>process.exit(res.statusCode===200?0:1)).on("error",()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://memory.arkadia.network
        - NEXT_PUBLIC_API_KEY=
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=https://memory.arkadia.network
      - NEXT_PUBLIC_API_KEY=
    depends_on:
      openmemory:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  openmemory_data:
    driver: local
